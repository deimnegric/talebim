        .login-input {
            width: 100%; padding: 0.9rem 1rem 0.9rem 2.75rem; border: 1.5px solid #ece8e5;
            border-radius: 1rem; outline: none; background: #fafaf9; font-size: 0.875rem;
            color: #1c1c1c; transition: all .15s ease;
        }
        .login-input::placeholder { color: #b4aeaa; }
        .login-input:focus { border-color: #dc2626; background: #ffffff; box-shadow: 0 0 0 4px rgba(220,38,38,0.08); }
        .login-input-plain { padding-left: 1rem; }
        .login-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: #b4aeaa; pointer-events: none; }
        .login-input:focus ~ .login-icon, .login-input:focus + .login-icon { color: #dc2626; }
        .role-btn {
            padding: 0.75rem 0.5rem; border-radius: 0.9rem; border: 1.5px solid #ece8e5;
            background: #fafaf9; font-size: 10.5px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.03em; color: #a19a95; cursor: pointer; transition: all .15s ease;
        }
        .role-btn-active { background: #dc2626; border-color: #dc2626; color: #ffffff; box-shadow: 0 4px 12px rgba(220,38,38,0.25); }

        .pin-input {
            width: 100%; padding: 1rem; border: 1.5px solid #ece8e5; border-radius: 1rem;
            outline: none; background: #fafaf9; text-align: center; font-size: 1.75rem;
            font-weight: 800; letter-spacing: 0.6em; color: #1c1c1c; transition: all .15s ease;
        }
        .pin-input:focus { border-color: #dc2626; background: #ffffff; box-shadow: 0 0 0 4px rgba(220,38,38,0.08); }
        .pin-shake { animation: pinShake .4s ease; border-color: #dc2626 !important; }
        @keyframes pinShake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(4px); }
            30%, 50%, 70% { transform: translateX(-8px); }
            40%, 60% { transform: translateX(8px); }
        }

        .photo-btn {
            width: 100%; height: 6.5rem; border: 2px dashed #f5c9c9; border-radius: 1rem;
            background: #fff8f8; color: #dc2626; font-size: 10px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.04em; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 0.4rem; cursor: pointer; transition: all .15s ease;
        }
        .photo-btn:hover { background: #fef0f0; border-color: #dc2626; }

        .badge { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; padding: 0.3rem 0.6rem; border-radius: 999px; white-space: nowrap; }
        .badge-pending { color: #b45309; background: #fffbeb; }
        .badge-approved { color: #16a34a; background: #f0fdf4; }
        .badge-deleted { color: #dc2626; background: #fef2f2; }

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyArSP36nTu0RaAECH1GvPCjg3SaLA3Hg50",
            authDomain: "mail-35b9d.firebaseapp.com",
            projectId: "mail-35b9d",
            storageBucket: "mail-35b9d.firebasestorage.app",
            messagingSenderId: "522534406053",
            appId: "1:522534406053:web:542774241892c780918a4c",
            measurementId: "G-3LR972L5Z6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        let user = {};
        let uploadedUrls = {1: null, 2: null};
        let editingDocId = null;
        let msAllDocs = [];
        let bsAllDocs = [];
        let bsInitialLoadDone = false;
        const BS_PASSWORD = "9553";

        // ---------- LOGIN ----------
        function selectRole(role) {
            document.getElementById('role').value = role;
            document.getElementById('roleBtnMS').className = role === 'MS' ? 'role-btn role-btn-active' : 'role-btn';
            document.getElementById('roleBtnBS').className = role === 'BS' ? 'role-btn role-btn-active' : 'role-btn';
            if (role === 'BS') {
                document.getElementById('msLoginView').classList.add('hidden');
                document.getElementById('bsLoginView').classList.remove('hidden');
                const pin = document.getElementById('bsPassword');
                pin.value = '';
                document.getElementById('bsError').classList.add('hidden');
                setTimeout(() => pin.focus(), 50);
            } else {
                document.getElementById('bsLoginView').classList.add('hidden');
                document.getElementById('msLoginView').classList.remove('hidden');
            }
        }

        function backToMsLogin() {
            document.getElementById('bsPassword').value = '';
            document.getElementById('bsError').classList.add('hidden');
            selectRole('MS');
        }

        function handleBsPassword() {
            const pin = document.getElementById('bsPassword');
            if (pin.value.length < BS_PASSWORD.length) return;

        // ---------- GÖRSEL SIKIŞTIRMA ----------
        function compressImage(file, maxDimension = 1600, quality = 0.72) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxDimension || height > maxDimension) {
                            if (width > height) { height = Math.round(height * (maxDimension / width)); width = maxDimension; }
                            else { width = Math.round(width * (maxDimension / height)); height = maxDimension; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('Sıkıştırma başarısız')), 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

            try {
                const compressed = await compressImage(file);
                document.getElementById(`photoSlot${id}`).innerHTML = `<div class="photo-btn"><span>Yükleniyor...</span></div>`;
                const ref = storage.ref(`images/${Date.now()}_foto${id}.jpg`);
                await ref.put(compressed, { contentType: 'image/jpeg' });
                const url = await ref.getDownloadURL();
                uploadedUrls[id] = url;
                renderPhotoPreview(id, url);
                checkGonderButton();

        // ---------- ORTAK YARDIMCI FONKSİYONLAR ----------
        function formatDate(item) {
            if (!item.tarih || !item.tarih.seconds) return '-';
            return new Date(item.tarih.seconds * 1000).toLocaleDateString('tr-TR');
        }
        function matchesDateRange(item, start, end) {
            if (!start && !end) return true;
            if (!item.tarih || !item.tarih.seconds) return true;
            const itemDate = new Date(item.tarih.seconds * 1000);
            if (start) { const s = new Date(start); s.setHours(0,0,0,0); if (itemDate < s) return false; }
            if (end) { const e = new Date(end); e.setHours(23,59,59,999); if (itemDate > e) return false; }
            return true;
        }
        function matchesSearch(item, term) {
            if (!term) return true;
            const hay = `${item.magaza || ''} ${item.gonderen || ''} ${item.urunAdi || ''} ${item.kodAd || ''} ${formatDate(item)}`.toLowerCase();
            return hay.includes(term);
        }

        async function updateAndSend(docId) {
            const settings = JSON.parse(localStorage.getItem('bs_settings') || "{}");
            if (!settings.sid) return alert("Lütfen önce ayarları yapın!");
            const updatedData = {
                kodAd: document.getElementById(`edit-kodAd-${docId}`).value,
                adet: document.getElementById(`edit-adet-${docId}`).value,
                skt: document.getElementById(`edit-skt-${docId}`).value,
                pno: document.getElementById(`edit-pno-${docId}`).value,
                problem: document.getElementById(`edit-problem-${docId}`).value
            };
            if (confirm("Bilgiler güncellenerek mail gönderilsin mi?")) {
                try {
                    const doc = await db.collection("bildirimler").doc(docId).get();
                    const fullItem = { ...doc.data(), ...updatedData };
                    emailjs.init(settings.pk);
                    await emailjs.send(settings.sid, settings.tid, {
                        bs_mail: settings.email, urun_adi: fullItem.kodAd, adet: fullItem.adet,
                        problem: fullItem.problem, uretici: fullItem.uretici, skt: fullItem.skt,
                        pno: fullItem.pno, img1: fullItem.img1, img2: fullItem.img2,
                        magaza: fullItem.magaza || '—', gonderen: fullItem.gonderen || '—'
                    });
                    await db.collection("bildirimler").doc(docId).update({ ...updatedData, durum: "onaylandi" });
                    alert("Güncellendi ve Gönderildi!");
                } catch (err) { alert("Hata! Ayarları kontrol edin."); }
            }
        }

            showToast(`Yeni Talep Mevcut - ${label}`);
            playBeep();
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('Yeni Talep Mevcut', { body: `${label} — ${item.magaza || ''}` });
            }
        }

        function showToast(text) {
            const toast = document.getElementById('toastNotif');
            document.getElementById('toastNotifText').innerText = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                osc.stop(ctx.currentTime + 0.35);
            } catch (e) {}
        }
    </script>
</body>
</html>
